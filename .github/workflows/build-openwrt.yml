name: Build OpenWrt
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 挂载4G虚拟内存
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: 安装依赖环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison qemu-utils git wget curl unzip python3 python3-distutils

      - name: 克隆ImmortalWrt源码
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          # 这里不再复制外部.config，使用源码默认配置
          [ -f ../diy.sh ] && bash ../diy.sh

      - name: 预下载源码包
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: 编译固件
        run: |
          cd openwrt
          # 先调出配置界面选择K2P A2
          make menuconfig <<EOF
          4
          1
          phicomm_k2p-a2
          EOF
          make -j$(nproc)

      - name: 上传固件成品
        uses: actions/upload-artifact@v4
        with:
          path: openwrt/bin/targets/**/*.bin
