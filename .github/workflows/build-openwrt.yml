name: Build OpenWrt

on:
  push:
    branches: master
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_SH: diy.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget

      - name: Clone source
        run: |
          git clone $REPO_URL openwrt --branch $REPO_BRANCH --depth 1
          cd openwrt
          cp ../$CONFIG_FILE .config
          [ -f ../$DIY_SH ] && chmod +x ../$DIY_SH && ../$DIY_SH

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) download
          make -j$(nproc)

      - name: Upload firmware
        uses: actions/upload-artifact@main
        with:
          path: openwrt/bin/targets/**/*.bin
