name: Build OpenWrt
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 挂载4G虚拟内存【关键修复】
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: 安装依赖环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison qemu-utils git wget curl unzip python3 python3-distutils

      - name: 克隆Lean源码
        run: |
          git clone https://github.com/coolsnowwolf/lede.git openwrt
          cd openwrt
          cp ../.config .config
          [ -f ../diy.sh ] && bash ../diy.sh

      - name: 预下载源码包
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc)

      - name: 上传固件成品
        uses: actions/upload-artifact@v4
        with:
          path: openwrt/bin/targets/**/*.bin
