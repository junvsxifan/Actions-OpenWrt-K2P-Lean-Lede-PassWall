name: Build OpenWrt
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone LEDE Source
        run: |
          git clone https://github.com/coolsnowwolf/lede openwrt
          cd openwrt
          sed -i 's/feeds.conf.default$/feeds.conf.default\nsrc-git passwall https://github.com/xiaorouji/openwrt-passwall/' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy .config
        run: |
          cp $GITHUB_WORKSPACE/.config openwrt/.config

      - name: Compile
        working-directory: ./openwrt
        run: |
          make -j1 V=s
