name: Build OpenWrt

on:
  push:
    branches: master
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  CONFIG_FILE: .config
  DIY_SH: diy.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Init Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget

      - name: Clone Source
        run: |
          git clone $REPO_URL openwrt --branch $REPO_BRANCH --depth 1
          cd openwrt
          cp ../$CONFIG_FILE .config
          [ -f ../$DIY_SH ] && chmod +x ../$DIY_SH && ../$DIY_SH

      - name: Build firmware
        run: |
          cd openwrt
          export TERM=xterm
          # 替换国内镜像源
          sed -i 's/downloads.openwrt.org/mirrors.tuna.tsinghua.edu.cn\/openwrt/g' feeds.conf.default
          sed -i 's/git.openwrt.org/mirrors.tuna.tsinghua.edu.cn\/git-openwrt/g' feeds.conf.default
          make defconfig
          # 增加wget超时参数，减少无效死等
          export WGET_OPT="--timeout=30 --tries=3"
          make -j$(nproc) download V=s
          make -j$(nproc) V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: firmware
          path: openwrt/bin/targets/**/*.bin
