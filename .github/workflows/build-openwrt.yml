name: Build OpenWrt
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 挂载4G虚拟内存
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison qemu-utils git wget curl unzip python3 python3-distutils

      - name: 下载ImmortalWrt源码
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          # 固定目标机型 K2P A2
          echo "CONFIG_TARGET_ath79=y" > .config
          echo "CONFIG_TARGET_ath79_generic=y" >> .config
          echo "CONFIG_TARGET_ath79_generic_DEVICE_phicomm_k2p-a2=y" >> .config
          # 基础必选包
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_ca-bundle=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ath9k=y" >> .config
          echo "CONFIG_PACKAGE_wpad-basic-wolfssl=y" >> .config
          # 关闭IPv6
          echo "CONFIG_IPV6=n" >> .config
          # 执行预配置扩展
          [ -f ../diy.sh ] && bash ../diy.sh
          # 展开完整配置
          make defconfig

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc)

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          path: openwrt/bin/targets/**/*.bin
